<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#24143D"/>
      <stop offset="100%" stop-color="#120A21"/>
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C084FC"/>
      <stop offset="100%" stop-color="#8161A3"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#8161A3" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background squircle -->
  <rect width="128" height="128" rx="28" fill="url(#bg-grad)"/>
  <rect x="2" y="2" width="124" height="124" rx="26" fill="none" stroke="#8161A3" stroke-opacity="0.35" stroke-width="2"/>

  <!-- Brand purple wings/petals (JAAGR Mark) -->
  <path d="M92 24 L106 18 C108 17 110 19 109 21 L103 29 C102 30 100 30 99 29 L92 24 Z" fill="#D8B4FE" />
  <path d="M96 34 L110 28 C112 27 114 29 113 31 L107 39 C106 40 104 40 103 39 L96 34 Z" fill="url(#accent-grad)" />
  <path d="M98 45 L108 40 C110 39 111 41 110 42 L105 49 C104 50 102 50 101 49 L98 45 Z" fill="#8161A3" />

  <!-- Mint energy accent dot -->
  <circle cx="111" cy="14" r="3.5" fill="#5EEAD4" filter="url(#glow)"/>

  <!-- JAAGR 'J' monogram in crisp warm white -->
  <path d="M72 32 
           C75 32 77 34 77 37
           L77 82
           C77 96 66 104 50 104
           C37 104 27 97 25 87
           C24 84 27 82 30 82
           C32 82 34 83 36 85
           C39 90 44 94 51 94
           C59 94 65 89 65 80
           L65 37
           C65 34 67 32 72 32 Z" 
        fill="#FDFBF7" 
        filter="url(#glow)"/>
</svg>
